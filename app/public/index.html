<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>personal-gpt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button id="newChatBtn" class="new-chat-btn">+ 새 대화</button>
      <button id="instructionsBtn" class="new-chat-btn instructions-btn">
        ⚙ 지침 설정
      </button>

      <div class="model-picker">
        <label for="modelSelect">모델</label>
        <select id="modelSelect"></select>
      </div>

      <div class="sidebar-footer">
        Azure AI Foundry 기반<br />personal-gpt
      </div>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="empty-state" id="emptyState">
          무엇을 도와드릴까요?
        </div>
      </div>

      <form id="chatForm" class="input-area">
        <textarea
          id="promptInput"
          placeholder="메시지를 입력하세요..."
          rows="1"
        ></textarea>
        <button type="submit" id="sendBtn">전송</button>
      </form>
    </main>
  </div>

  <div id="instructionsModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>지침 설정</h2>
      <p class="modal-desc">
        모든 대화에서 모델이 따를 지침(역할, 말투, 답변 형식 등)을 입력하세요.
        이 브라우저에 저장되며, 새 대화를 시작해도 유지됩니다.
      </p>
      <textarea
        id="instructionsInput"
        rows="8"
        placeholder="예: 당신은 친절한 한국어 비서입니다. 답변은 간결하게 핵심만 정리해서 알려주세요."
      ></textarea>
      <div class="modal-actions">
        <button id="instructionsClearBtn" type="button" class="btn-secondary">
          지우기
        </button>
        <div class="modal-actions-right">
          <button id="instructionsCancelBtn" type="button" class="btn-secondary">
            취소
          </button>
          <button id="instructionsSaveBtn" type="button" class="btn-primary">
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
